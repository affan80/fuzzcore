services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fuzzcore
      POSTGRES_USER: fuzzcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fuzzcore']
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 20
  api:
    build: services/api
    environment: &worker_env
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with the encoded local database password}
      REDIS_URL: redis://redis:6379/0
      FUZZCORE_TOKEN: ${FUZZCORE_TOKEN:?Set a random demo token locally}
    ports: ['127.0.0.1:8000:8000']
    networks: [data, ingress]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    build: services/api
    command: [rq, worker, scans, --url, redis://redis:6379/0]
    environment: *worker_env
    networks: [data, control]
    depends_on:
      api: {condition: service_started}
      scanner: {condition: service_started}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  scanner:
    build: services/api
    command: [uvicorn, fuzzcore.scanner:app, --host, 0.0.0.0, --port, '8082']
    networks: [control, labnet]
    depends_on: [lab, dns-lab]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  lab:
    build: services/lab
    networks: [labnet]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  dns-lab:
    build: services/api
    command: [python, -m, fuzzcore.dns_fixture]
    networks: [labnet]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  ingress: {}
  data: {internal: true}
  control: {internal: true}
  labnet: {internal: true}
volumes:
  pgdata:
  redisdata:
